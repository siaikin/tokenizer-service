[package]
name = "tokenizer-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "CJK tokenizer HTTP service for Jaburo Meilisearch indexing (ja/ko/zh/latin)"

[[bin]]
name = "tokenizer-service"
path = "src/main.rs"

[dependencies]
axum        = { version = "0.8",  features = ["json"] }
tokio       = { version = "1",    features = ["full"] }
tower       = { version = "0.5" }
tower-http  = { version = "0.6",  features = ["limit", "trace", "cors"] }

utoipa         = { version = "5", features = ["axum_extras", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "debug-embed", "reqwest", "cache"] }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"

sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "uuid", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio-util = { version = "0.7", features = ["rt"] }

tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"

# CJK tokenizers — embedded dictionaries (download from lindera.dev at build time)
lindera = { version = "1.5", default-features = false, features = ["embedded-ipadic", "embedded-ko-dic"] }
jieba-rs = "0.7"
regex = "1"
once_cell = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
